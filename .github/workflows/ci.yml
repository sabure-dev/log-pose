name: Log Pose CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python-test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: orders_test
          POSTGRES_PASSWORD: orders_test
          POSTGRES_DB: orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: ./order_service

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python configuration
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff Linter
        run: uv run ruff check .

      - name: Ruff Formatter
        run: uv run ruff format --check .

      - name: Running tests (PostgreSQL integration & unit)
        env:
          DB_USER: orders_test
          DB_PASS: orders_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: orders_test
          TEST_DATABASE_URL: "postgresql+asyncpg://orders_test:orders_test@localhost:5432/orders_test"
        run: uv run pytest

  go-test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: inventory_test
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./inventory_service

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: ./inventory_service/go.sum

      - name: Check Go Formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Go Vet
        run: go vet ./...

      - name: Go Test (with Race Detector, PostgreSQL & RabbitMQ Integration)
        env:
          TEST_DATABASE_URL: "postgres://inventory_test:inventory_test@localhost:5432/inventory_test?sslmode=disable"
          TEST_RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
        run: go test -race -p 1 -v ./...
