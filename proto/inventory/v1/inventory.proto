syntax = "proto3";

package inventory.v1;

option go_package = "inventory_service/internal/pb/inventoryv1;inventoryv1";

service InventoryService {
  rpc CheckStockAvailability(CheckStockAvailabilityRequest) returns (CheckStockAvailabilityResponse);
  rpc GetProductStock(GetProductStockRequest) returns (GetProductStockResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
}

message StockItemRequest {
  string product_id = 1;
  int32 quantity = 2;
  string expected_price = 3;
}

enum AvailabilityStatus {
  AVAILABILITY_STATUS_UNSPECIFIED = 0;
  AVAILABILITY_STATUS_OK = 1;
  AVAILABILITY_STATUS_PRODUCT_NOT_FOUND = 2;
  AVAILABILITY_STATUS_PRICE_MISMATCH = 3;
  AVAILABILITY_STATUS_INSUFFICIENT_STOCK = 4;
  AVAILABILITY_STATUS_INVALID_QUANTITY = 5;
}

message StockItemResult {
  string product_id = 1;
  AvailabilityStatus status = 2;
  string catalog_price = 3;
  int32 available_stock = 4;
  string reason = 5;
}

message CheckStockAvailabilityRequest {
  repeated StockItemRequest items = 1;
}

message CheckStockAvailabilityResponse {
  bool eligible = 1;
  AvailabilityStatus overall_status = 2;
  repeated StockItemResult items = 3;
  string reason = 4;
}

message GetProductStockRequest {
  string product_id = 1;
}

message GetProductStockResponse {
  string product_id = 1;
  string name = 2;
  string price = 3;
  int32 available = 4;
  int32 reserved = 5;
}

message ListProductsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListProductsResponse {
  repeated GetProductStockResponse products = 1;
  int32 total = 2;
}
