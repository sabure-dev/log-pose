x-order-env: &order-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: orders_user
  DB_PASS: ${ORDERS_DB_PASSWORD}
  DB_NAME: orders_db
  RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/"
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-logpose-internal-secret}

services:
  postgres:
    image: postgres:18-alpine
    container_name: logpose_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - logpose_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: logpose_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - logpose_net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  order_service:
    build: order_service/
    container_name: orders_api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *order-env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/orders/healthcheck', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    networks:
      - logpose_net

  order_outbox_worker:
    build: order_service/
    container_name: logpose_outbox_worker
    command: ["uv", "run", "--no-sync", "python", "-m", "app.workers.outbox_relay"]
    depends_on:
      order_service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *order-env
    restart: always
    networks:
      - logpose_net

  order_inventory_worker:
    build: order_service/
    container_name: logpose_order_inventory_worker
    command: ["uv", "run", "--no-sync", "python", "-m", "app.workers.inventory_consumer"]
    depends_on:
      order_service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *order-env
    restart: always
    networks:
      - logpose_net

  inventory_service:
    build: inventory_service/
    container_name: logpose_inventory_service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://inventory_user:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory_db?sslmode=disable"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/"
      SEED_CATALOG: "true"
    restart: unless-stopped
    networks:
      - logpose_net

networks:
  logpose_net:
    driver: bridge

volumes:
  postgres_data:
