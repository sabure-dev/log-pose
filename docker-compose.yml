x-order-env: &order-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: orders_user
  DB_PASS: ${ORDERS_DB_PASSWORD}
  DB_NAME: orders_db
  RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/"
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-logpose-internal-secret}
  INVENTORY_GRPC_HOST: inventory_service
  INVENTORY_GRPC_PORT: 50051
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: logpose_jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - logpose_net

  postgres:
    image: postgres:18-alpine
    container_name: logpose_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway_password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - logpose_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: logpose_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - logpose_net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  order_service:
    build: order_service/
    container_name: orders_api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory_service:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      <<: *order-env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/orders/healthcheck', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    networks:
      - logpose_net

  order_outbox_worker:
    build: order_service/
    container_name: logpose_outbox_worker
    command: ["uv", "run", "--no-sync", "python", "-m", "app.workers.outbox_relay"]
    depends_on:
      order_service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      <<: *order-env
    restart: always
    networks:
      - logpose_net

  order_inventory_worker:
    build: order_service/
    container_name: logpose_order_inventory_worker
    command: ["uv", "run", "--no-sync", "python", "-m", "app.workers.inventory_consumer"]
    depends_on:
      order_service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      <<: *order-env
    restart: always
    networks:
      - logpose_net

  inventory_service:
    build: inventory_service/
    container_name: logpose_inventory_service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://inventory_user:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory_db?sslmode=disable"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/"
      SEED_CATALOG: "${SEED_CATALOG:-true}"
      GRPC_PORT: "${GRPC_PORT:-50051}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    restart: unless-stopped
    networks:
      - logpose_net

  gateway_service:
    build: gateway_service/
    container_name: logpose_gateway_service
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      order_service:
        condition: service_healthy
      inventory_service:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://gateway_user:${GATEWAY_DB_PASSWORD:-gateway_password}@postgres:5432/gateway_db?sslmode=disable"
      ORDER_SERVICE_URL: "http://order_service:8000"
      INVENTORY_GRPC_HOST: "inventory_service"
      INVENTORY_GRPC_PORT: "50051"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-logpose-internal-secret}
      JWT_SECRET: ${JWT_SECRET:-logpose-jwt-secret-key-change-in-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    restart: unless-stopped
    networks:
      - logpose_net

networks:
  logpose_net:
    driver: bridge

volumes:
  postgres_data:
